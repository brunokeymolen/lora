name: lora_text_app
description: LoRa encrypted P2P text messenger via BLE + SX1262

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE
  flutter_blue_plus: ^1.31.0

  # Runtime permissions
  permission_handler: ^11.3.1

  # Local notifications
  flutter_local_notifications: ^17.2.4

  # Coordinates and map links
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

  # State management
  provider: ^6.1.2

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo_icon.png
  adaptive_icon_foreground: assets/images/logo_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_monochrome: assets/images/logo_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_icon.png
    - assets/images/logo_banner.png
